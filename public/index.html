<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Estácio - Registo de Ponto</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { width: 100%; border-radius: 6px; margin-bottom: 15px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #004a99; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #003366; }
        #mensagem { margin-top: 15px; font-weight: bold; }
        .dica-seguranca { font-size: 12px; color: #666; margin-top: 12px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="container">
        <img src="banner.jpg" alt="Banner Jogos Estácio">
        <h2>Confirmação de Presença</h2>
        <p>Insira os seus dados para confirmar a entrada na competição:</p>
        
        <input type="text" id="nome" placeholder="Nome Completo" required>
        
        <button onclick="capturarPonto()">Confirmar Presença na Arena</button>
        
        <p class="dica-seguranca">
            🔒 <i>A validação requer a confirmação de proximidade do seu dispositivo.</i>
        </p>
        
        <p id="mensagem"></p>
    </div>

    <script>
        function capturarPonto() {
            const nome = document.getElementById('nome').value.trim();
            const msg = document.getElementById('mensagem');

            if (!nome) {
                alert('Por favor, digite o seu nome!');
                return;
            }

            if (!navigator.geolocation) {
                msg.style.color = 'red';
                msg.innerText = 'O seu navegador não suporta geolocalização.';
                return;
            }

            msg.style.color = '#004a99';
            msg.innerText = 'A validar proximidade da arena...';

            // Recolher informações do dispositivo/navegador
            const infoDispositivo = {
                userAgent: navigator.userAgent,
                plataforma: navigator.platform,
                idioma: navigator.language
            };

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const dados = {
                        usuario_id: nome,
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        precisao: position.coords.accuracy,
                        dispositivo: infoDispositivo.userAgent,
                        dataHora: new Date().toLocaleString('pt-BR')
                    };

                    try {
                        const resposta = await fetch('/api/salvar-localizacao', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(dados)
                        });

                        const resultado = await resposta.json();
                        if (resposta.ok) {
                            msg.style.color = 'green';
                            msg.innerText = 'Presença confirmada com sucesso!';
                        } else {
                            throw new Error(resultado.mensagem);
                        }
                    } catch (erro) {
                        msg.style.color = 'red';
                        msg.innerText = 'Erro ao conectar ao servidor.';
                    }
                },
                (error) => {
                    msg.style.color = 'red';
                    msg.innerText = 'Permissão necessária para confirmar a presença no local.';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>

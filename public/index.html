
      <!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Estácio - Registo de Ponto</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { width: 100%; border-radius: 6px; margin-bottom: 15px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #004a99; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #003366; }
        #mensagem { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <img src="banner.jpg" alt="Banner Jogos Estácio">
        <h2>Registo de Presença</h2>
        <p>Insira o seu nome para registar a localização e dados do dispositivo:</p>
        
        <input type="text" id="nome" placeholder="O seu nome completo" required>
        <button onclick="capturarPonto()">Registar Ponto</button>
        
        <p id="mensagem"></p>
    </div>

    <script>
        function capturarPonto() {
            const nome = document.getElementById('nome').value.trim();
            const msg = document.getElementById('mensagem');

            if (!nome) {
                alert('Por favor, digite o seu nome!');
                return;
            }

            if (!navigator.geolocation) {
                msg.style.color = 'red';
                msg.innerText = 'O seu navegador não suporta geolocalização.';
                return;
            }

            msg.style.color = 'blue';
            msg.innerText = 'A obter localização e dados do dispositivo...';

            // Recolher informações do dispositivo/navegador
            const infoDispositivo = {
                userстыйAgent: navigator.userAgent,
                plataforma: navigator.platform,
                idioma: navigator.language
            };

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const dados = {
                        usuario_id: nome,
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        precisao: position.coords.accuracy,
                        dispositivo: infoDispositivo.userстыйAgent,
                        dataHora: new Date().toLocaleString('pt-BR')
                    };

                    try {
                        const resposta = await fetch('/api/salvar-localizacao', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(dados)
                        });

                        const resultado = await resposta.json();
                        if (resposta.ok) {
                            msg.style.color = 'green';
                            msg.innerText = 'Ponto registado com sucesso!';
                        } else {
                            throw new Error(resultado.mensagem);
                        }
                    } catch (erro) {
                        msg.style.color = 'red';
                        msg.innerText = 'Erro ao enviar dados para o servidor.';
                    }
                },
                (error) => {
                    msg.style.color = 'red';
                    msg.innerText = 'Erro ao obter GPS. Certifique-se de permitir a localização.';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>

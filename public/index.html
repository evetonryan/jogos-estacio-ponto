<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Estácio - Registo de Ponto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to bottom, #5c94fc 0%, #5c94fc 70%, #00a800 70%, #00a800 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .fundo-animado {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 60%;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0, rgba(255,255,255,0.1) 20px, transparent 20px, transparent 40px);
            animation: moverFundo 20s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes moverFundo {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container {
            max-width: 400px;
            width: 100%;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
            border: 4px solid #d92b04;
        }

        img { width: 100%; border-radius: 6px; margin-bottom: 15px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button.btn-principal { 
            background-color: #d92b04; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            width: 100%; 
            border-radius: 4px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px #9b1d02;
        }
        button.btn-principal:active { transform: translateY(2px); box-shadow: 0 2px #9b1d02; }
        button.btn-principal:hover { background-color: #f13c10; }

        .btn-musica {
            background-color: #f8b800;
            color: #000;
            border: 2px solid #b8860b;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
            z-index: 2;
            position: relative;
            box-shadow: 0 3px #c69200;
        }
        .btn-musica:active { transform: translateY(2px); box-shadow: 0 1px #c69200; }

        #mensagem { margin-top: 15px; font-weight: bold; }
        .dica-seguranca { font-size: 12px; color: #555; margin-top: 12px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="fundo-animado"></div>

    <!-- Botão interativo para iniciar o sintetizador de áudio -->
    <button class="btn-musica" onclick="alternarMusica()">🎵 Ligar Trilha Sonora (Retro)</button>

    <div class="container">
        <img src="banner.jpg" alt="Banner Jogos Estácio">
        <h2>Confirmação de Presença</h2>
        <p>Insira os seus dados para confirmar a entrada na competição:</p>
        
        <input type="text" id="nome" placeholder="Nome Completo" required>
        
        <button class="btn-principal" onclick="capturarPonto()">Confirmar Presença na Arena</button>
        
        <p class="dica-seguranca">
            🔒 <i>A validação requer a confirmação de proximidade do seu dispositivo.</i>
        </p>
        
        <p id="mensagem"></p>
    </div>

    <script>
        let audioCtx = null;
        let loopInterval = null;
        let tocando = false;

        // Notas musicais em frequências (Hz) para criar uma melodia alegre estilo jogo clássico
        const melodia = [
            { freq: 659.25, duracao: 200 }, // E5
            { freq: 659.25, duracao: 200 }, // E5
            { freq: 0,      duracao: 200 }, // pausa
            { freq: 659.25, duracao: 200 }, // E5
            { freq: 0,      duracao: 200 }, // pausa
            { freq: 523.25, duracao: 200 }, // C5
            { freq: 659.25, duracao: 200 }, // E5
            { freq: 0,      duracao: 200 }, // pausa
            { freq: 783.99, duracao: 400 }, // G5
            { freq: 0,      duracao: 400 }, // pausa
            { freq: 392.00, duracao: 400 }, // G4
        ];

        function tocarNota(freq, duracao) {
            if (!audioCtx) return;
            if (freq === 0) return; // Se for pausa, não toca som

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                // Estilo de onda quadrada (dá o som característico de consola retro tipo NES)
                osc.type = 'square';
                osc.frequency.value = freq;

                // Controlo de volume para evitar estalos
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duracao / 1000));

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + (duracao / 1000));
            } catch (e) {
                console.error(e);
            }
        }

        function iniciarLoopMelodia() {
            let index = 0;
            loopInterval = setInterval(() => {
                if (!tocando) return;
                const nota = melodia[index];
                tocarNota(nota.freq, nota.duracao);
                index = (index + 1) % melodia.length;
            }, 300); // Velocidade do ritmo
        }

        function alternarMusica() {
            const btn = document.querySelector('.btn-musica');

            if (!tocando) {
                // Inicializa o contexto de áudio após o clique do utilizador (obrigatório nos telemóveis)
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                tocando = true;
                btn.innerText = '🔇 Desligar Trilha Sonora';
                iniciarLoopMelodia();
            } else {
                tocando = false;
                clearInterval(loopInterval);
                btn.innerText = '🎵 Ligar Trilha Sonora (Retro)';
            }
        }

        function capturarPonto() {
            const nome = document.getElementById('nome').value.trim();
            const msg = document.getElementById('mensagem');

            if (!nome) {
                alert('Por favor, digite o seu nome!');
                return;
            }

            if (!navigator.geolocation) {
                msg.style.color = 'red';
                msg.innerText = 'O seu navegador não suporta geolocalização.';
                return;
            }

            msg.style.color = '#004a99';
            msg.innerText = 'A validar proximidade da arena...';

            const infoDispositivo = {
                userAgent: navigator.userAgent,
                plataforma: navigator.platform,
                idioma: navigator.language
            };

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const dados = {
                        usuario_id: nome,
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        precisao: position.coords.accuracy,
                        dispositivo: infoDispositivo.userAgent,
                        dataHora: new Date().toLocaleString('pt-BR')
                    };

                    try {
                        const resposta = await fetch('/api/salvar-localizacao', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(dados)
                        });

                        const resultado = await resposta.json();
                        if (resposta.ok) {
                            msg.style.color = 'green';
                            msg.innerText = 'Presença confirmada com sucesso!';
                        } else {
                            throw new Error(resultado.mensagem);
                        }
                    } catch (erro) {
                        msg.style.color = 'red';
                        msg.innerText = 'Erro ao conectar ao servidor.';
                    }
                },
                (error) => {
                    msg.style.color = 'red';
                    msg.innerText = 'Permissão necessária para confirmar a presença no local.';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Estácio - Registo de Ponto</title>
    <style>
        /* Fundo animado inspirado no estilo Super Mario (Céu azul com gradiente e nuvens/movimento) */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to bottom, #5c94fc 0%, #5c94fc 70%, #00a800 70%, #00a800 100%);
            background-size: 100% 100%;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Efeito de nuvens ou blocos decorativos a passar no fundo */
        .fundo-animado {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 60%;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0, rgba(255,255,255,0.1) 20px, transparent 20px, transparent 40px);
            animation: moverFundo 20s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes moverFundo {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container {
            max-width: 400px;
            width: 100%;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
            border: 4px solid #d92b04; /* Estilo arcade/Mario */
        }

        img { width: 100%; border-radius: 6px; margin-bottom: 15px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button.btn-principal { 
            background-color: #d92b04; /* Vermelho estilo Mario */ 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            width: 100%; 
            border-radius: 4px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px #9b1d02;
        }
        button.btn-principal:active { transform: translateY(2px); box-shadow: 0 2px #9b1d02; }
        button.btn-principal:hover { background-color: #f13c10; }

        .btn-musica {
            background-color: #f8b800;
            color: #000;
            border: 2px solid #b8860b;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
            z-index: 2;
            position: relative;
        }

        #mensagem { margin-top: 15px; font-weight: bold; }
        .dica-seguranca { font-size: 12px; color: #555; margin-top: 12px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="fundo-animado"></div>

    <!-- Botão para ativar a música (devido às regras dos navegadores) -->
    <button class="btn-musica" onclick="tocarMusica()">🎵 Ligar Trilha Sonora (Mario)</button>

    <div class="container">
        <img src="banner.jpg" alt="Banner Jogos Estácio">
        <h2>Confirmação de Presença</h2>
        <p>Insira os seus dados para confirmar a entrada na competição:</p>
        
        <input type="text" id="nome" placeholder="Nome Completo" required>
        
        <button class="btn-principal" onclick="capturarPonto()">Confirmar Presença na Arena</button>
        
        <p class="dica-seguranca">
            🔒 <i>A validação requer a confirmação de proximidade do seu dispositivo.</i>
        </p>
        
        <p id="mensagem"></p>
    </div>

    <!-- Elemento de áudio com a musiquinha (usando um link público livre do tema do Mario) -->
    <audio id="audioFundo" loop>
        <source src="https://vgmsite.com/soundtracks/super-mario-bros/sfzffzbu/01%20Ground%20Theme.mp3" type="audio/mpeg">
    </audio>

    <script>
        let musicaLigada = false;

        function tocarMusica() {
            const audio = document.getElementById('audioFundo');
            const btn = document.querySelector('.btn-musica');
            
            if (!musicaLigada) {
                audio.play().then(() => {
                    musicaLigada = true;
                    btn.innerText = '🔇 Desligar Trilha Sonora';
                }).catch(e => {
                    alert('O navegador bloqueou o autoplay. Tente clicar novamente.');
                });
            } else {
                audio.pause();
                musicaLigada = false;
                btn.innerText = '🎵 Ligar Trilha Sonora (Mario)';
            }
        }

        function capturarPonto() {
            const nome = document.getElementById('nome').value.trim();
            const msg = document.getElementById('mensagem');

            if (!nome) {
                alert('Por favor, digite o seu nome!');
                return;
            }

            if (!navigator.geolocation) {
                msg.style.color = 'red';
                msg.innerText = 'O seu navegador não suporta geolocalização.';
                return;
            }

            msg.style.color = '#004a99';
            msg.innerText = 'A validar proximidade da arena...';

            const infoDispositivo = {
                userAgent: navigator.userAgent,
                plataforma: navigator.platform,
                idioma: navigator.language
            };

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const dados = {
                        usuario_id: nome,
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        precisao: position.coords.accuracy,
                        dispositivo: infoDispositivo.userAgent,
                        dataHora: new Date().toLocaleString('pt-BR')
                    };

                    try {
                        const resposta = await fetch('/api/salvar-localizacao', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(dados)
                        });

                        const resultado = await resposta.json();
                        if (resposta.ok) {
                            msg.style.color = 'green';
                            msg.innerText = 'Presença confirmada com sucesso!';
                        } else {
                            throw new Error(resultado.mensagem);
                        }
                    } catch (erro) {
                        msg.style.color = 'red';
                        msg.innerText = 'Erro ao conectar ao servidor.';
                    }
                },
                (error) => {
                    msg.style.color = 'red';
                    msg.innerText = 'Permissão necessária para confirmar a presença no local.';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
